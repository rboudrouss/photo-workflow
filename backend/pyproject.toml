[project]
name = "photoflow"
version = "0.1.0"
description = "Pipeline d'extraction d'informations sur des photos anciennes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11",
    "imagehash>=4.3",
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "anthropic>=0.69",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Serveur de coordination : regroupement des visages (HDBSCAN) et construction des series tournent la, sur les
# vecteurs deja en base. Pas de modele, pas de torch.
server = [
    "scikit-learn>=1.5",
]
# Modeles specialises (embeddings, visages, clustering). Lourd : torch, transformers, onnxruntime.
ml = [
    "torch>=2.5",
    "transformers>=4.51",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "insightface>=0.7.3",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "nudenet>=3.4",
]

[project.scripts]
photoflow = "photoflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoflow"]

# Torch CPU par defaut (fonctionne en amd64 et arm64, donc sur ta machine, un Spark ou un Mac en Docker).
# Pour CUDA, voir docs/models.md.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
