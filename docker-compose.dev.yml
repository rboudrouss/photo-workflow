# Environnement de DEV : ta machine (GTX 970 4 Go, 23 Go RAM, 16 coeurs).
# Tout tourne sur CPU, modeles petits. Objectif : valider la tuyauterie et le schema, pas la qualite.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml run --rm api photoflow db init
#   docker compose -f docker-compose.dev.yml run --rm api photoflow ingest /photos/samples
#
# Voir docs/models.md pour les choix de modeles.

name: photoflow-dev

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://photoflow:photoflow@db:5432/photoflow
    PHOTOS_ROOT: /photos
    DATA_DIR: /data
    DEVICE: cpu
    EMBEDDING_MODEL: google/siglip2-base-patch16-256
    EMBEDDING_DIM: "768"
    VLM_BACKEND: ${VLM_BACKEND:-llama}
    LLM_BASE_URL: http://llm:8080/v1
    # Cote CPU, 896 px au lieu de 1024 divise presque par deux le temps d'encodage de l'image.
    VLM_MAX_SIDE: ${VLM_MAX_SIDE:-896}
    # 1 pour tester le relais des requetes de recherche vers un worker (comme sur le serveur sans modeles).
    QUERY_VIA_WORKERS: ${QUERY_VIA_WORKERS:-0}
  volumes:
    - ${PHOTOS_DIR:-./samples}:/photos:ro
    - photoflow-data:/data

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: photoflow
      POSTGRES_PASSWORD: photoflow
      POSTGRES_DB: photoflow
    ports: ["5432:5432"]
    volumes:
      - photoflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoflow"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    command: photoflow serve
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  # Worker CPU pour embeddings + visages (rapide meme sur CPU).
  worker-ml:
    <<: *backend
    command: photoflow worker --extractors physical,embedding,faces,nudity
    depends_on:
      db: { condition: service_healthy }

  # Worker VLM separe : lent, on peut le couper sans bloquer le reste.
  worker-vlm:
    <<: *backend
    command: photoflow worker --extractors vlm
    depends_on:
      db: { condition: service_healthy }
      llm: { condition: service_started }

  # Petit VLM local sur CPU (llama.cpp). Qwen3-VL 4B en Q4 : ~3 Go de RAM, lent mais fonctionnel.
  # Telecharge le modele et le projecteur vision (mmproj) depuis Hugging Face au premier demarrage.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf ${LLM_HF_REPO:-Qwen/Qwen3-VL-4B-Instruct-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      -c 8192 -np 1 --jinja
      --threads ${LLM_THREADS:-12}
    environment:
      LLAMA_CACHE: /models
    ports: ["8080:8080"]
    volumes:
      - photoflow-llm:/models

  web:
    build: ./web
    environment:
      PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # Surveille le dossier photos : un fichier ajoute est ingere au passage suivant.
  watcher:
    <<: *backend
    command: photoflow watch --interval 10
    depends_on:
      db: { condition: service_healthy }

volumes:
  photoflow-db:
  photoflow-data:
  photoflow-llm:
