# SERVEUR de coordination (petite machine, ex. photoflow.rboud.com) : base, API, interface, reverse proxy.
# Aucun worker ici : le calcul vient des workers distants (docker-compose.worker.yml) ou d'une grosse
# machine branchee directement sur la base (docker-compose.yml).
#
#   cp .env.example .env     # PHOTOS_DIR, POSTGRES_PASSWORD, DOMAIN, UI_USER, UI_PASSWORD_HASH
#   docker compose -f docker-compose.server.yml up -d --build
#   docker compose -f docker-compose.server.yml run --rm api photoflow db init
#   docker compose -f docker-compose.server.yml run --rm api photoflow ingest /photos
#
# Les workers distants s'appairent depuis la page « Workers » (bouton Approuver) ; `photoflow workers create`
# reste disponible pour un jeton fixe.
#
# Caddy obtient le certificat TLS tout seul (ports 80/443 ouverts, DNS du domaine vers cette machine) et
# protege l'interface et l'API par mot de passe ; seules les routes /api/worker/* passent sans mot de passe,
# elles exigent un jeton de worker. Hash du mot de passe : docker run --rm caddy caddy hash-password.

name: photoflow-server

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://photoflow:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@db:5432/photoflow
    PHOTOS_ROOT: /photos
    DATA_DIR: /data
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-google/siglip2-base-patch16-256}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
    # Meme origine que le site (Caddy sert / et /api) : pas de CORS a ouvrir.
    CORS_ORIGINS: '["https://${DOMAIN:?definir DOMAIN}"]'
  volumes:
    - ${PHOTOS_DIR:?definir PHOTOS_DIR dans .env}:/photos:ro
    - photoflow-data:/data
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: photoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: photoflow
    volumes:
      - photoflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: photoflow serve
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    environment:
      PUBLIC_API_BASE: https://${DOMAIN}
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      UI_USER: ${UI_USER:-photoflow}
      UI_PASSWORD_HASH: ${UI_PASSWORD_HASH:?definir UI_PASSWORD_HASH (docker run --rm caddy caddy hash-password)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - photoflow-caddy:/data
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  photoflow-db:
  photoflow-data:
  photoflow-caddy:
